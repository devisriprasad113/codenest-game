<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in to GitHub · GitHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .logo-container {
            margin-bottom: 24px;
            text-align: center;
        }
        .logo {
            font-size: 3rem;
            color: #f0f6fc;
        }
        .title {
            font-size: 1.5rem;
            font-weight: 300;
            color: #f0f6fc;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }
        .login-card {
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 6px;
            width: 100%;
            max-width: 308px;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 400;
            margin-bottom: 8px;
            color: #c9d1d9;
            text-align: left;
        }
        .input-field {
            width: 100%;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 5px 12px;
            color: #c9d1d9;
            font-size: 0.875rem;
            outline: none;
            line-height: 20px;
        }
        .input-field:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.3);
        }
        .btn-submit {
            width: 100%;
            background-color: #238636;
            border: 1px solid rgba(240, 246, 252, 0.1);
            border-radius: 6px;
            color: #ffffff;
            padding: 5px 16px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            line-height: 20px;
            margin-top: 20px;
        }
        .btn-submit:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <i class="fab fa-github logo"></i>
    </div>
    
    <h1 class="title">Sign in to GitHub</h1>

    <div class="login-card">
        <form th:action="@{/auth/social-login}" method="POST">
            <input type="hidden" name="provider" value="github" />
            
            <div class="form-group">
                <label for="login_field">Username or email address</label>
                <input type="text" id="login_field" name="username" class="input-field" required="required" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="input-field" value="••••••••••••••" disabled="disabled" />
            </div>

            <button type="submit" class="btn-submit">Sign in</button>
        </form>
    </div>

</body>
</html>
